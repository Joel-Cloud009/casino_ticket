<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>무대 화면 · 혁혁 브라더스와 함께하는 SC사업본부 워크샵</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Jua&family=Gowun+Dodum&display=swap">
<style>
  /* 앱과 같은 'D-2 팝 축제 · 혁혁 브라더스' 톤: 크림 점무늬 + 잉크 테두리 스티커 (무대는 테두리 3px · 그림자 5px)
     크기는 1280×720 시안 px 값 × --u (화면 크기에 맞춰 늘고 줄어듦) */
  :root {
    --cream: #FFF6E5; --cream-dot: #F2E3C4; --paper: #FFFFFF;
    --ink: #1E1A2E; --ink-muted: #6B6478;
    --red: #FF4D3D; --yellow: #FFD23F; --yellow-soft: #FFF1C2;
    --blue: #3FA9F5; --blue-deep: #1E86E0; --mint: #2DBE8C; --grape: #9B7BEA;
    --stamp-red: #D92A1F; --sold-bg: #F3EBDD; --sky: #DDF0FF;
    --font-display: "Bagel Fat One", "Black Han Sans", sans-serif;
    --font-label: "Jua", "Gowun Dodum", sans-serif;
    --font-body: "Gowun Dodum", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    --u: min(calc(100vw / 1280), calc(100vh / 720));
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    color: var(--ink); overflow: hidden; font-family: var(--font-body);
    background: radial-gradient(var(--cream-dot) calc(2 * var(--u)), transparent calc(2 * var(--u))) 0 0 / calc(24 * var(--u)) calc(24 * var(--u)), var(--cream);
  }
  b, strong { font-weight: 400; }
  .wrap { position: relative; height: 100%; display: grid; grid-template-rows: auto 1fr; padding: calc(20 * var(--u)) calc(30 * var(--u)) calc(26 * var(--u)); gap: calc(18 * var(--u)); }

  /* 혁 · 혁 별 스티커: 별 안 "혁"은 Jua + 흰색 + 잉크 그림자 하나 (Bagel·외곽선 금지 → "헉"처럼 읽힘) */
  .hy-star { position: relative; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .hy-star svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; }
  .hy-star span { position: relative; font-family: var(--font-label); line-height: 1; color: #FFFFFF; }
  .hl { padding: 0 calc(3 * var(--u)); background: linear-gradient(transparent 58%, var(--yellow) 58%, var(--yellow) 92%, transparent 92%); }

  /* 상단 바 (StageHeader) */
  header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: calc(24 * var(--u)); }
  .title { display: flex; align-items: center; gap: calc(14 * var(--u)); min-width: 0; }
  .title .stars { display: flex; align-items: center; flex-shrink: 0; }
  .title .stars .hy-star { width: calc(64 * var(--u)); height: calc(64 * var(--u)); }
  .title .stars .hy-star span { font-size: calc(38 * var(--u)); text-shadow: calc(2 * var(--u)) calc(2 * var(--u)) 0 var(--ink); }
  .title .stars .hy-star + .hy-star { margin-left: calc(-5 * var(--u)); }
  .title-text { display: flex; flex-direction: column; align-items: flex-start; gap: calc(5 * var(--u)); min-width: 0; }
  .t-bros { display: flex; align-items: baseline; gap: calc(5 * var(--u)); white-space: nowrap; }
  .t-bros b { font-family: var(--font-display); font-size: calc(24 * var(--u)); line-height: 1; }
  .t-bros span { font-family: var(--font-label); font-size: calc(19 * var(--u)); line-height: 1; }
  .t-name { font-family: var(--font-display); font-size: calc(32 * var(--u)); line-height: 1.08; white-space: nowrap; }
  .t-date {
    padding: 0 calc(12 * var(--u)); border-radius: 99px; background: var(--yellow); border: calc(2.5 * var(--u)) solid var(--ink); box-shadow: calc(2 * var(--u)) calc(2 * var(--u)) 0 var(--ink);
    font-family: var(--font-label); font-size: calc(15 * var(--u)); line-height: calc(22 * var(--u)); white-space: nowrap;
  }
  .status {
    display: inline-flex; align-items: center; gap: calc(10 * var(--u)); padding: calc(8 * var(--u)) calc(22 * var(--u)); border-radius: 99px;
    background: var(--sold-bg); border: calc(3 * var(--u)) solid var(--ink); box-shadow: calc(4 * var(--u)) calc(4 * var(--u)) 0 var(--ink);
    font-family: var(--font-label); font-size: calc(24 * var(--u)); line-height: 1.2; white-space: nowrap; transform: rotate(-2deg);
  }
  .status i { width: calc(14 * var(--u)); height: calc(14 * var(--u)); border-radius: 50%; background: var(--paper); border: calc(2 * var(--u)) solid var(--ink); flex-shrink: 0; }
  .status.open { background: var(--mint); }
  .status.open i { animation: live 1.6s ease-in-out infinite; }
  @keyframes live { 50% { transform: scale(.6); } }
  .counter {
    justify-self: end; width: calc(330 * var(--u)); padding: calc(10 * var(--u)) calc(16 * var(--u)) calc(12 * var(--u)); border-radius: calc(20 * var(--u));
    background: var(--paper); border: calc(3 * var(--u)) solid var(--ink); box-shadow: calc(5 * var(--u)) calc(5 * var(--u)) 0 var(--ink);
    display: flex; flex-direction: column; gap: calc(8 * var(--u));
  }
  .counter-row { display: flex; align-items: flex-end; justify-content: space-between; gap: calc(8 * var(--u)); }
  .counter .label { font-family: var(--font-label); font-size: calc(17 * var(--u)); padding-bottom: calc(4 * var(--u)); white-space: nowrap; }
  .counter .num { font-family: var(--font-display); font-size: calc(46 * var(--u)); line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .counter .num span { font-family: var(--font-label); font-size: calc(22 * var(--u)); color: var(--ink-muted); }
  .counter .bar { height: calc(18 * var(--u)); border-radius: 99px; border: calc(2.5 * var(--u)) solid var(--ink); background: var(--cream); overflow: hidden; }
  .counter .bar i {
    display: block; height: 100%; border-right: calc(2.5 * var(--u)) solid var(--ink); transition: width .6s ease;
    background: repeating-linear-gradient(135deg, var(--yellow) 0 calc(10 * var(--u)), #FFC21A calc(10 * var(--u)) calc(20 * var(--u)));
  }

  main { display: grid; grid-template-columns: minmax(0, 1fr) calc(360 * var(--u)); gap: calc(24 * var(--u)); min-height: 0; }

  /* 상품 현황 (StagePrizeGrid) */
  .prizes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: min-content; gap: calc(14 * var(--u)); align-content: start; overflow: hidden; min-height: 0; padding: 0 calc(5 * var(--u)) calc(5 * var(--u)) 0; }
  .prize {
    position: relative; padding: calc(10 * var(--u)) calc(18 * var(--u)) calc(10 * var(--u)) calc(10 * var(--u)); border-radius: calc(20 * var(--u));
    background: var(--paper); border: calc(3 * var(--u)) solid var(--ink); box-shadow: calc(4 * var(--u)) calc(4 * var(--u)) 0 var(--ink);
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: calc(14 * var(--u)); align-items: center;
  }
  .prize.first { background: var(--yellow); }
  .prize.soldout:not(.first) { background: var(--sold-bg); }
  .p-emoji {
    position: relative; width: calc(84 * var(--u)); height: calc(84 * var(--u)); border-radius: calc(14 * var(--u)); overflow: hidden;
    border: calc(2.5 * var(--u)) solid var(--ink); display: grid; place-items: center; font-size: calc(44 * var(--u));
    background: repeating-linear-gradient(135deg, var(--cream) 0 calc(9 * var(--u)), #FBEBCB calc(9 * var(--u)) calc(18 * var(--u)));
  }
  .p-emoji .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: var(--paper); }
  .prize.soldout .p-emoji .photo { filter: grayscale(1); opacity: .5; }
  .stamp {
    position: absolute; left: 50%; top: 50%; width: calc(68 * var(--u)); height: calc(68 * var(--u)); margin: calc(-34 * var(--u)) 0 0 calc(-34 * var(--u)); border-radius: 50%;
    border: calc(3 * var(--u)) solid var(--stamp-red); box-shadow: inset 0 0 0 calc(2 * var(--u)) var(--paper), inset 0 0 0 calc(4 * var(--u)) var(--stamp-red);
    background: rgba(255, 255, 255, .9); color: var(--stamp-red); transform: rotate(-14deg);
    display: flex; align-items: center; justify-content: center; text-align: center;
    font-family: var(--font-display); font-size: calc(14 * var(--u)); line-height: 1.05;
  }
  .p-info { display: flex; flex-direction: column; align-items: flex-start; gap: calc(6 * var(--u)); min-width: 0; }
  .p-grade {
    padding: 0 calc(10 * var(--u)); border-radius: 99px; background: var(--yellow); border: calc(2 * var(--u)) solid var(--ink);
    font-family: var(--font-display); font-size: calc(16 * var(--u)); line-height: calc(24 * var(--u)); white-space: nowrap;
  }
  .prize.first .p-grade { background: var(--red); color: var(--paper); }
  .p-name { font-family: var(--font-label); font-size: calc(22 * var(--u)); line-height: 1.1; }
  .p-winners { max-width: 100%; font-size: calc(14 * var(--u)); color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .p-left { text-align: right; }
  .p-left b { display: block; font-family: var(--font-display); font-size: calc(38 * var(--u)); line-height: 1; }
  .p-left span { display: block; font-family: var(--font-label); font-size: calc(13 * var(--u)); color: var(--ink-muted); margin-top: calc(4 * var(--u)); white-space: nowrap; }
  .prize.first .p-winners, .prize.first .p-left span { color: var(--ink); }
  /* 상품이 9개 이상이면 한 단계 작게 (한 화면에 다 들어가게) */
  .prizes.dense { gap: calc(10 * var(--u)); }
  .prizes.dense .prize { padding-top: calc(6 * var(--u)); padding-bottom: calc(6 * var(--u)); }
  .prizes.dense .p-emoji { width: calc(64 * var(--u)); height: calc(64 * var(--u)); }
  .prizes.dense .stamp { transform: rotate(-14deg) scale(.8); }
  .prizes.dense .p-name { font-size: calc(19 * var(--u)); }
  .prizes.dense .p-left b { font-size: calc(30 * var(--u)); }

  /* 실시간 결과 (StageFeed) */
  .feed {
    padding: calc(14 * var(--u)) calc(14 * var(--u)) calc(12 * var(--u)); border-radius: calc(22 * var(--u));
    background: var(--paper); border: calc(3 * var(--u)) solid var(--ink); box-shadow: calc(5 * var(--u)) calc(5 * var(--u)) 0 var(--ink);
    display: flex; flex-direction: column; gap: calc(5 * var(--u)); min-height: 0; overflow: hidden;
  }
  .feed h2 { margin: 0; padding: 0 calc(4 * var(--u)) calc(4 * var(--u)); display: flex; align-items: center; justify-content: space-between; font-family: var(--font-label); font-weight: 400; font-size: calc(22 * var(--u)); }
  .live {
    display: flex; align-items: center; gap: calc(6 * var(--u)); padding: 0 calc(10 * var(--u)); border-radius: 99px; background: var(--mint); border: calc(2 * var(--u)) solid var(--ink);
    font-family: var(--font-label); font-size: calc(13 * var(--u)); letter-spacing: .06em; line-height: calc(22 * var(--u));
  }
  .live i { width: calc(8 * var(--u)); height: calc(8 * var(--u)); border-radius: 50%; background: var(--paper); border: calc(1.5 * var(--u)) solid var(--ink); animation: live 1.6s ease-in-out infinite; }
  .feed-list { display: flex; flex-direction: column; gap: calc(5 * var(--u)); overflow: hidden; }
  .feed-item {
    display: flex; align-items: center; gap: calc(10 * var(--u)); padding: calc(4 * var(--u)) calc(8 * var(--u));
    border-radius: calc(14 * var(--u)); border: calc(2 * var(--u)) solid transparent;
  }
  .feed-item.big { background: var(--yellow-soft); border-color: var(--ink); }
  .feed-item.newest { background: var(--yellow); border-color: var(--ink); }
  .feed-item.enter { animation: slideIn .5s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes slideIn { from { transform: translateX(calc(40 * var(--u))) rotate(2deg); opacity: 0; } }
  .feed-item .fe {
    width: calc(36 * var(--u)); height: calc(36 * var(--u)); border-radius: calc(10 * var(--u)); flex-shrink: 0; overflow: hidden;
    background: var(--paper); border: calc(2 * var(--u)) solid var(--ink); display: grid; place-items: center; font-size: calc(20 * var(--u));
  }
  .feed-item .fe .photo { width: 100%; height: 100%; object-fit: cover; display: block; }
  .feed-item .fe svg { width: 70%; height: 70%; }
  .feed-item .fn { flex: 1; min-width: 0; display: flex; align-items: center; gap: calc(8 * var(--u)); font-family: var(--font-label); font-size: calc(19 * var(--u)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .feed-item .fr {
    flex-shrink: 0; padding: 0 calc(9 * var(--u)); border-radius: calc(8 * var(--u)); background: var(--cream); border: calc(2 * var(--u)) solid var(--ink);
    font-family: var(--font-label); font-size: calc(15 * var(--u)); line-height: calc(22 * var(--u));
  }
  .feed-item.big .fr, .feed-item.newest .fr { background: var(--paper); }
  .team {
    display: inline-block; padding: 0 .6em; border-radius: 99px; background: var(--c); border: calc(2 * var(--u)) solid var(--ink); color: var(--ink);
    font-family: var(--font-label); font-size: calc(13 * var(--u)); line-height: calc(20 * var(--u)); white-space: nowrap; flex-shrink: 0;
  }
  .empty { color: var(--ink-muted); font-size: calc(18 * var(--u)); text-align: center; padding: calc(30 * var(--u)) 0; }

  /* 당첨 발표 (AnnounceStage): 햇살 바탕 · 노란 별폭발 위 상품 카드 · 오른쪽 외침과 당첨자 */
  #announce {
    position: fixed; inset: 0; z-index: 10; overflow: hidden; display: grid; place-items: center;
    background: var(--cream); animation: fadeIn .35s ease;
  }
  #announce.hide { animation: fadeOut .5s ease forwards; }
  @keyframes fadeIn { from { opacity: 0; } }
  @keyframes fadeOut { to { opacity: 0; } }
  /* 햇살 가운데 = 별폭발 가운데 (시안 400, 364) */
  .an-rays {
    position: absolute; width: 300vmax; height: 300vmax;
    left: calc(50% - 240 * var(--u) - 150vmax); top: calc(50% + 4 * var(--u) - 150vmax);
    background: repeating-conic-gradient(var(--sky) 0 7deg, var(--cream) 7deg 14deg);
    animation: spin 60s linear infinite;
  }
  #announce.tier-legend .an-rays { background: repeating-conic-gradient(var(--sky) 0 7deg, var(--cream) 7deg 14deg, #FFE7A0 14deg 21deg, var(--cream) 21deg 28deg); animation-duration: 30s; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .an-frame { position: relative; z-index: 2; width: calc(1280 * var(--u)); height: calc(720 * var(--u)); }
  .an-deco { position: absolute; inset: 0; width: 100%; height: 100%; }
  .an-burst { position: absolute; left: calc(105 * var(--u)); top: calc(69 * var(--u)); width: calc(590 * var(--u)); height: calc(590 * var(--u)); overflow: visible; animation: burst-in .7s cubic-bezier(.2, 1.4, .4, 1) both; }
  @keyframes burst-in { from { transform: scale(.2) rotate(-40deg); opacity: 0; } }
  .an-card {
    position: absolute; left: calc(196 * var(--u)); top: calc(200 * var(--u)); width: calc(408 * var(--u));
    padding: calc(14 * var(--u)) calc(16 * var(--u)) calc(16 * var(--u)); border-radius: calc(24 * var(--u));
    background: var(--paper); border: calc(3.5 * var(--u)) solid var(--ink); box-shadow: calc(8 * var(--u)) calc(8 * var(--u)) 0 var(--ink);
    transform: rotate(-4deg); display: flex; flex-direction: column; align-items: flex-start; gap: calc(12 * var(--u));
    animation: card-in .7s .12s cubic-bezier(.2, 1.4, .4, 1) both;
  }
  @keyframes card-in { from { transform: rotate(-16deg) scale(.4); opacity: 0; } }
  .an-grade {
    padding: 0 calc(16 * var(--u)); border-radius: 99px; background: var(--red); border: calc(2.5 * var(--u)) solid var(--ink); box-shadow: calc(2 * var(--u)) calc(2 * var(--u)) 0 var(--ink);
    color: var(--paper); font-family: var(--font-display); font-size: calc(26 * var(--u)); line-height: calc(38 * var(--u)); white-space: nowrap;
  }
  .an-emoji {
    width: 100%; height: calc(226 * var(--u)); border-radius: calc(14 * var(--u)); overflow: hidden;
    background: var(--cream); border: calc(2.5 * var(--u)) solid var(--ink); display: grid; place-items: center; font-size: calc(140 * var(--u)); line-height: 1;
  }
  .an-emoji .photo { width: 100%; height: 100%; object-fit: cover; mix-blend-mode: multiply; display: block; }
  .an-tape { position: absolute; left: calc(150 * var(--u)); top: calc(-18 * var(--u)); width: calc(90 * var(--u)); height: calc(26 * var(--u)); background: rgba(63, 169, 245, .55); border: calc(2 * var(--u)) solid var(--ink); transform: rotate(-3deg); }
  .an-text { position: absolute; left: calc(740 * var(--u)); top: 0; bottom: 0; width: calc(500 * var(--u)); display: flex; flex-direction: column; justify-content: center; align-items: flex-start; }
  /* 외침: Bagel + 잉크 4px 외곽선 + 10px 그림자 */
  .an-congrats {
    --o: calc(4 * var(--u)); --sh: calc(10 * var(--u));
    font-family: var(--font-display); font-size: calc(150 * var(--u)); line-height: 1; color: var(--red); white-space: nowrap;
    transform: rotate(-6deg); transform-origin: left center;
    text-shadow:
      calc(var(--o) * -1) calc(var(--o) * -1) 0 var(--ink), var(--o) calc(var(--o) * -1) 0 var(--ink),
      calc(var(--o) * -1) var(--o) 0 var(--ink), var(--o) var(--o) 0 var(--ink),
      0 calc(var(--o) * -1) 0 var(--ink), 0 var(--o) 0 var(--ink),
      calc(var(--o) * -1) 0 0 var(--ink), var(--o) 0 0 var(--ink),
      var(--sh) var(--sh) 0 var(--ink);
    animation: shout-in .7s .3s cubic-bezier(.2, 1.6, .4, 1) both;
  }
  #announce.tier-epic .an-congrats { font-size: calc(86 * var(--u)); color: var(--yellow); --o: calc(3.5 * var(--u)); --sh: calc(8 * var(--u)); }
  #announce.tier-rare .an-congrats { font-size: calc(96 * var(--u)); color: var(--blue-deep); --o: calc(3.5 * var(--u)); --sh: calc(8 * var(--u)); }
  @keyframes shout-in { from { transform: rotate(-20deg) scale(.3); opacity: 0; } }
  .an-pill {
    margin-top: calc(34 * var(--u)); padding: calc(4 * var(--u)) calc(26 * var(--u)); border-radius: 99px;
    background: var(--yellow); border: calc(3 * var(--u)) solid var(--ink); box-shadow: calc(4 * var(--u)) calc(4 * var(--u)) 0 var(--ink);
    font-family: var(--font-label); font-size: calc(34 * var(--u)); white-space: nowrap; animation: pop .6s .45s cubic-bezier(.2, 1.4, .4, 1) both;
  }
  .an-prize { margin-top: calc(18 * var(--u)); font-family: var(--font-display); font-size: calc(62 * var(--u)); line-height: 1.1; animation: pop .6s .55s cubic-bezier(.2, 1.4, .4, 1) both; }
  .an-rule { margin: calc(24 * var(--u)) 0; width: calc(440 * var(--u)); border-top: calc(4 * var(--u)) dashed var(--ink); }
  .an-who { display: flex; align-items: center; gap: calc(20 * var(--u)); white-space: nowrap; animation: pop .7s .7s cubic-bezier(.2, 1.4, .4, 1) both; }
  .an-who .team { padding: calc(2 * var(--u)) calc(20 * var(--u)); border-width: calc(3 * var(--u)); box-shadow: calc(4 * var(--u)) calc(4 * var(--u)) 0 var(--ink); font-size: calc(36 * var(--u)); line-height: calc(54 * var(--u)); }
  .an-who b { font-family: var(--font-display); font-size: calc(100 * var(--u)); line-height: 1; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } }
  /* 색종이 비 (원색 + 잉크 테두리) */
  .coin {
    position: absolute; top: calc(-40 * var(--u)); z-index: 1; pointer-events: none;
    width: calc(16 * var(--u)); height: calc(28 * var(--u)); border-radius: calc(4 * var(--u));
    background: var(--c); border: calc(2.5 * var(--u)) solid var(--ink);
    animation: fall linear forwards;
  }
  .coin.bit-circle { width: calc(22 * var(--u)); height: calc(22 * var(--u)); border-radius: 50%; }
  .coin.bit-spark { width: calc(34 * var(--u)); height: calc(34 * var(--u)); background: none; border: 0; }
  .coin svg { display: block; width: 100%; height: 100%; }
  @keyframes fall { to { transform: translateY(115vh) rotate(var(--r)); } }

  /* 아래 버튼 (소리 · 입장 QR) */
  .sound-btn {
    position: fixed; right: 2vw; bottom: 2.4vh; z-index: 20; cursor: pointer;
    padding: calc(7 * var(--u)) calc(16 * var(--u)); border-radius: calc(12 * var(--u));
    background: var(--paper); color: var(--ink); border: calc(2.5 * var(--u)) solid var(--ink); box-shadow: calc(3 * var(--u)) calc(3 * var(--u)) 0 var(--ink);
    font-family: var(--font-label); font-size: calc(16 * var(--u)); transition: opacity .5s;
  }

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(() => {
  'use strict';
  const cfg = window.TICKET_CONFIG;
  const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, { auth: { persistSession: false } });
  // 팀 색 (앱과 같음): 칩 채움 전용, 위 글자는 잉크
  const TEAM_COLORS = ['#FF6B5E', '#3FA9F5', '#2DBE8C', '#9B7BEA', '#FFD23F', '#F58BC0', '#7FD3E8', '#C8D96B'];
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const team = (t) => (t ? `<span class="team" style="--c:${TEAM_COLORS[(t - 1) % 8]}">${t}팀</span>` : '');

  // ---- 혁혁 브라더스 로고 조각 (README "타이틀 로고") ----
  const STAR24 = '98,50 86.7,59.8 91.6,74 76.9,76.9 74,91.6 59.8,86.7 50,98 40.2,86.7 26,91.6 23.1,76.9 8.4,74 13.3,59.8 2,50 13.3,40.2 8.4,26 23.1,23.1 26,8.4 40.2,13.3 50,2 59.8,13.3 74,8.4 76.9,23.1 91.6,26 86.7,40.2';
  const STAR36 = '99,50 85.5,56.2 96,66.8 81.2,68 87.5,81.5 73.1,77.6 74.5,92.4 62.3,83.8 58.5,98.3 50,86 41.5,98.3 37.7,83.8 25.5,92.4 26.9,77.6 12.5,81.5 18.8,68 4,66.8 14.5,56.2 1,50 14.5,43.8 4,33.2 18.8,32 12.5,18.5 26.9,22.4 25.5,7.6 37.7,16.2 41.5,1.7 50,14 58.5,1.7 62.3,16.2 74.5,7.6 73.1,22.4 87.5,18.5 81.2,32 96,33.2 85.5,43.8';
  const SPARK_D = 'M12 1C13 8 16 11 23 12C16 13 13 16 12 23C11 16 8 13 1 12C8 11 11 8 12 1Z';
  // 별 안 "혁": Jua + 흰색 + 잉크 그림자 하나 (Bagel Fat One·외곽선 금지 → "헉"처럼 읽힘)
  const hyukStar = (fill, rot, shadow, sw) => `
    <div class="hy-star" style="transform:rotate(${rot}deg)">
      <svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="${STAR24}" fill="#1E1A2E" transform="translate(${shadow} ${shadow})"/><polygon points="${STAR24}" fill="${fill}" stroke="#1E1A2E" stroke-width="${sw}" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>
      <span>혁</span>
    </div>`;
  $('stage-title').innerHTML = `
    <div class="stars">${hyukStar('#FF4D3D', -10, 4, 2.5)}${hyukStar('#3FA9F5', 9, 4, 2.5)}</div>
    <div class="title-text">
      <div class="t-bros"><b>브라더스</b><span>와 함께하는</span></div>
      <div class="t-name hl">SC사업본부 워크샵</div>
      <div class="t-date">럭키 드로우 · 10.15 – 16</div>
    </div>`;
  $('qr-logo').innerHTML = `${hyukStar('#FF4D3D', -10, 3.5, 3.5)}${hyukStar('#3FA9F5', 9, 3.5, 3.5)}<span class="hl">브라더스</span>`;
  $('qr-star').innerHTML = `<polygon points="${STAR24}" fill="#1E1A2E" transform="translate(4 4)"/><polygon points="${STAR24}" fill="#FFD23F" stroke="#1E1A2E" stroke-width="3" vector-effect="non-scaling-stroke" stroke-linejoin="round"/><path d="M50 30 L50 70 M30 50 L70 50" stroke="#1E1A2E" stroke-width="4" vector-effect="non-scaling-stroke" stroke-linecap="round"/>`;
  const SAD = '<svg viewBox="0 0 24 24" fill="none" stroke="#1E1A2E" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8.5 16.5c1.8-2 5.2-2 7 0M9 9.5h.01M15 9.5h.01"/></svg>';
  // 발표 화면 가장자리 색종이 · 반짝이 · 물결 (ScreenStageAnnounce)
  const ANNOUNCE_DECO = `
    <svg class="an-deco" viewBox="0 0 1280 720" aria-hidden="true">
      <g stroke="#1E1A2E" stroke-width="2.5" stroke-linejoin="round">
        <rect x="60" y="150" width="18" height="32" rx="4" fill="#FF4D3D" transform="rotate(-26 69 166)"/>
        <circle cx="70" cy="420" r="12" fill="#2DBE8C"/>
        <rect x="40" y="590" width="18" height="18" rx="3" fill="#FFD23F" transform="rotate(22 49 599)"/>
        <rect x="690" y="40" width="16" height="30" rx="4" fill="#3FA9F5" transform="rotate(30 698 55)"/>
        <circle cx="1220" cy="70" r="11" fill="#FFD23F"/>
        <rect x="1196" y="300" width="16" height="30" rx="4" fill="#FF4D3D" transform="rotate(34 1204 315)"/>
        <circle cx="1236" cy="520" r="10" fill="#9B7BEA"/>
        <rect x="1150" y="640" width="18" height="18" rx="3" fill="#2DBE8C" transform="rotate(-18 1159 649)"/>
        <circle cx="700" cy="660" r="9" fill="#FF4D3D"/>
        <rect x="640" y="380" width="14" height="26" rx="4" fill="#FFD23F" transform="rotate(-30 647 393)"/>
        <circle cx="380" cy="30" r="8" fill="#9B7BEA"/>
        <circle cx="440" cy="694" r="9" fill="#3FA9F5"/>
        <rect x="960" y="30" width="14" height="14" rx="3" fill="#2DBE8C" transform="rotate(18 967 37)"/>
      </g>
      <path d="${SPARK_D}" transform="translate(1100 140) scale(2)" fill="#FFD23F" stroke="#1E1A2E" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
      <path d="${SPARK_D}" transform="translate(1110 560) scale(1.4)" fill="#FFFFFF" stroke="#1E1A2E" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
      <path d="M40 70 q14 -16 28 0 t28 0 t28 0" fill="none" stroke="#FF4D3D" stroke-width="6" stroke-linecap="round"/>
      <path d="M1120 440 q14 -16 28 0 t28 0 t28 0" fill="none" stroke="#3FA9F5" stroke-width="6" stroke-linecap="round"/>
    </svg>`;

  let prizes = [];
  let draws = [];          // 공개된(뜯은) 결과만
  let open = false;
  let seen = null;         // 이미 본 결과 id (처음 불러온 것은 발표하지 않음)
  let feedShown = null;    // 피드에 이미 그린 결과 id
  const queue = [];
  let showing = false;
  let sound = false;

  // 꽝이 아니고 '무대 발표'가 켜진 상품만 크게 발표 (흔한 상품은 목록에만)
  const isBig = (d) => !d.is_blank && prizes.find((p) => p.id === d.prize_id)?.announce !== false;
  // 연출 등급 (app.js 와 같은 기준): 맨 위 상품 = legend, 고급 = epic, 그 외 발표 상품 = rare
  const tierOf = (d) => {
    const p = prizes.find((x) => x.id === d.prize_id);
    if (p && prizes.find((x) => !x.is_blank)?.id === p.id) return 'legend';
    return p?.premium ? 'epic' : 'rare';
  };
  // 등급별 외침 글자 · 색종이 수 · 발표 시간 · 색종이 색
  const FX = {
    legend: { label: '대박!',     coins: 140, ms: 7000, colors: ['#FF4D3D', '#FFD23F', '#3FA9F5', '#2DBE8C', '#9B7BEA'] },
    epic:   { label: 'BIG WIN!',  coins: 90,  ms: 5500, colors: ['#FFD23F', '#9B7BEA', '#3FA9F5', '#FF4D3D'] },
    rare:   { label: '축하해요!', coins: 50,  ms: 5000, colors: ['#3FA9F5', '#2DBE8C', '#FFD23F'] },
  };

  // ---------------- 데이터 ----------------
  async function load() {
    const [pz, dr, st, pl] = await Promise.all([
      sb.from('ticket_prizes').select('*').order('sort').order('id'),
      sb.from('ticket_draws').select('id,player_name,team,prize_id,grade,prize_name,emoji,is_blank,revealed_at')
        .eq('revealed', true).order('revealed_at', { ascending: false }).limit(2000),
      sb.from('ticket_settings').select('*'),
      sb.from('ticket_players').select('id', { count: 'exact', head: true }),
    ]);
    if (pz.error || dr.error || st.error) { $('status').innerHTML = '<i></i>연결 오류'; return; }
    $('qr-joined').innerHTML = pl.error ? '' : `지금<b>${pl.count ?? 0}</b>명`;
    prizes = pz.data;
    draws = dr.data;
    open = st.data.some((s) => s.key === 'draw_open' && s.value === 'true');

    if (seen === null) {
      seen = new Set(draws.map((d) => d.id));
      // stage.html?demo → 최근 당첨을 다시 발표 (리허설용)
      if (new URLSearchParams(location.search).has('demo')) {
        // ?demo=legend|epic|rare 로 등급별 발표도 미리보기
        const want = new URLSearchParams(location.search).get('demo');
        const pick = want && prizes.find((p) => !p.is_blank && tierOf({ prize_id: p.id }) === want);
        const last = (pick && { player_name: '홍길동', team: 1, prize_id: pick.id, grade: pick.grade, prize_name: pick.name, emoji: pick.emoji })
          || draws.find(isBig)
          || { player_name: '홍길동', team: 1, prize_id: null, grade: 'A상', prize_name: '미리보기 상품', emoji: '🎁' };
        queue.push(last);
        setTimeout(nextAnnounce, 800);
      }
    } else {
      // 오래된 것부터 발표
      const fresh = draws.filter((d) => !seen.has(d.id)).reverse();
      for (const d of fresh) {
        seen.add(d.id);
        if (isBig(d)) queue.push(d);
      }
      if (fresh.length) beep(fresh.some(isBig) ? null : 'blip');
      nextAnnounce();
    }
    render();
  }

  // 상품 사진이 있으면 사진, 없으면 이모지
  function visual(prizeId, emoji) {
    const url = prizes.find((p) => p.id === prizeId)?.image_url;
    return url
      ? `<img class="photo" src="${esc(url)}" alt="" onerror="this.replaceWith(document.createTextNode(this.dataset.fallback))" data-fallback="${esc(emoji)}">`
      : esc(emoji);
  }

  function render() {
    const total = prizes.reduce((s, p) => s + p.quantity, 0);
    const remaining = prizes.reduce((s, p) => s + p.remaining, 0);
    $('counter').innerHTML = `${remaining}<span> / ${total}</span>`;
    $('counter-bar').style.width = `${total ? Math.round((remaining / total) * 100) : 0}%`;
    $('status').innerHTML = `<i></i>${open ? '뽑기 진행 중' : '곧 뽑기가 시작됩니다'}`;
    $('status').className = `status ${open ? 'open' : ''}`;

    const real = prizes.filter((p) => !p.is_blank);
    $('prizes').classList.toggle('dense', real.length > 8);
    $('prizes').innerHTML = real.length === 0
      ? '<div class="empty">상품 준비 중…</div>'
      : real.map((p, i) => {
        const won = draws.filter((d) => d.prize_id === p.id);
        const left = p.quantity - won.length;
        const who = !won.length ? '아직 당첨자 없음'
          : p.announce === false ? `당첨 ${won.length}명`
          : won.map((d) => esc(d.player_name)).join(' · ');
        return `
          <div class="prize ${i === 0 ? 'first' : ''} ${left <= 0 ? 'soldout' : ''}">
            <div class="p-emoji">${visual(p.id, p.emoji)}${left <= 0 ? '<div class="stamp">SOLD<br>OUT</div>' : ''}</div>
            <div class="p-info"><span class="p-grade">${esc(p.grade)}</span><div class="p-name">${esc(p.name)}</div><div class="p-winners">${who}</div></div>
            <div class="p-left"><b>${left}</b><span>/ ${p.quantity} 남음</span></div>
          </div>`;
      }).join('');

    // 5초마다 다시 그려도 새로 들어온 결과만 애니메이션
    const firstRender = feedShown === null;
    feedShown = feedShown || new Set();
    $('feed').innerHTML = draws.length === 0
      ? '<div class="empty">아직 결과가 없어요</div>'
      : draws.slice(0, 14).map((d, i) => `
        <div class="feed-item ${i === 0 ? 'newest' : ''} ${isBig(d) ? 'big' : ''} ${!firstRender && !feedShown.has(d.id) ? 'enter' : ''}">
          <div class="fe">${d.is_blank ? SAD : visual(d.prize_id, d.emoji)}</div>
          <div class="fn">${team(d.team)}${esc(d.player_name)}</div>
          <div class="fr">${esc(d.grade)}</div>
        </div>`).join('');
    draws.forEach((d) => feedShown.add(d.id));
  }

  // ---------------- 당첨 발표 ----------------
  function nextAnnounce() {
    if (showing || !queue.length) return;
    showing = true;
    const d = queue.shift();
    const el = document.createElement('div');
    const tier = tierOf(d);
    el.id = 'announce';
    el.className = `tier-${tier}`;
    // 이름이 길면 이름 글자만 줄임 (줄바꿈 안 함)
    const nameLen = [...String(d.player_name ?? '')].length;
    const nameSize = Math.min(100, Math.round(400 / Math.max(4, nameLen)));
    el.innerHTML = `
      <div class="an-rays"></div>
      <div class="an-frame">
        ${ANNOUNCE_DECO}
        <svg class="an-burst" viewBox="0 0 100 100" aria-hidden="true"><polygon points="${STAR36}" fill="#1E1A2E" transform="translate(1.4 1.4)"/><polygon points="${STAR36}" fill="#FFD23F" stroke="#1E1A2E" stroke-width="4" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>
        <div class="an-card">
          <div class="an-grade">${esc(d.grade)}</div>
          <div class="an-emoji">${visual(d.prize_id, d.emoji)}</div>
          <div class="an-tape" aria-hidden="true"></div>
        </div>
        <div class="an-text">
          <div class="an-congrats">${esc(FX[tier].label)}</div>
          <div class="an-pill">${esc(d.grade)} 당첨</div>
          <div class="an-prize">${esc(d.prize_name)}</div>
          <div class="an-rule"></div>
          <div class="an-who">${team(d.team)}<b style="font-size:calc(${nameSize} * var(--u))">${esc(d.player_name)}</b></div>
        </div>
      </div>`;
    document.body.appendChild(el);
    beep(tier === 'legend' ? 'jackpot' : 'fanfare');
    coinRain(FX[tier].coins, FX[tier].colors);
    setTimeout(() => {
      el.classList.add('hide');
      setTimeout(() => { el.remove(); showing = false; nextAnnounce(); }, 500);
    }, queue.length ? 3000 : FX[tier].ms);   // 뒤에 대기 중이면 3초, 아니면 등급별 시간
  }

  // 색종이 비: 원 · 둥근 사각형 · 반짝이 (원색 + 잉크 테두리)
  function coinRain(n = 50, colors = FX.rare.colors) {
    for (let i = 0; i < n; i++) {
      const c = document.createElement('div');
      const color = colors[i % colors.length];
      const shape = i % 6 === 0 ? 'spark' : i % 2 ? 'circle' : 'rect';
      c.className = `coin bit-${shape}`;
      if (shape === 'spark') c.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${SPARK_D}" fill="${color}" stroke="#1E1A2E" stroke-width="2" stroke-linejoin="round"/></svg>`;
      else c.style.setProperty('--c', color);
      c.style.left = `${Math.random() * 100}vw`;
      c.style.setProperty('--r', `${Math.random() * 720 - 360}deg`);
      c.style.animationDuration = `${1.8 + Math.random() * 1.8}s`;
      c.style.animationDelay = `${Math.random() * 1.2}s`;
      // 발표 화면 안(사진·이름 뒤)으로 떨어지게
      (document.getElementById('announce') || document.body).appendChild(c);
      setTimeout(() => c.remove(), 5000);
    }
  }

  // ---------------- 소리 (브라우저 정책상 한 번 클릭해야 켜짐) ----------------
  let ac = null;
  function beep(kind) {
    if (!sound || !kind) return;
    try {
      ac = ac || new AudioContext();
      const now = ac.currentTime;
      const tone = (f, s, len, vol, type = 'triangle') => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = type; o.frequency.value = f;
        g.gain.setValueAtTime(vol, now + s);
        g.gain.exponentialRampToValueAtTime(0.0001, now + s + len);
        o.connect(g).connect(ac.destination);
        o.start(now + s); o.stop(now + s + len + 0.02);
      };
      if (kind === 'fanfare') {
        [392, 523, 659, 784].forEach((f, i) => tone(f, i * 0.12, 0.2, 0.15));
        [1047, 1319, 1568].forEach((f) => tone(f, 0.5, 1.0, 0.1));
      }
      if (kind === 'jackpot') {
        [523, 659, 784, 1047, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, i * 0.09, 0.16, 0.14));
        [1047, 1319, 1568, 2093].forEach((f) => tone(f, 0.8, 1.8, 0.09));
        [131, 196].forEach((f) => tone(f, 0.8, 1.3, 0.12, 'sawtooth'));
      }
      if (kind === 'blip') tone(660, 0, 0.12, 0.06, 'sine');
    } catch {}
  }
  $('sound-btn').addEventListener('click', () => {
    sound = !sound;
    $('sound-btn').textContent = sound ? '소리 켜짐' : '소리 켜기';
    $('sound-btn').classList.toggle('on', sound);
    if (sound) { ac = ac || new AudioContext(); ac.resume(); }
  });
  // 입장 QR: 버튼 · Q 키로 열고, 클릭 · Q · Esc 로 닫기
  const qrView = $('qr-view');
  const toggleQr = (show = qrView.hidden) => { qrView.hidden = !show; document.body.classList.toggle('qr-open', show); };
  $('qr-btn').addEventListener('click', () => toggleQr(true));
  qrView.addEventListener('click', () => toggleQr(false));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'f' || e.key === 'F') {
      if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.();
    }
    if (e.code === 'KeyQ') toggleQr();   // 한글 입력 상태(ㅂ)에서도 동작
    if (e.key === 'Escape') toggleQr(false);
  });
  // 마우스를 안 움직이면 버튼 숨김
  let idleTimer;
  document.addEventListener('mousemove', () => {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => document.body.classList.add('idle'), 3000);
  });

  // ---------------- 실시간 ----------------
  let t = null;
  const schedule = () => { clearTimeout(t); t = setTimeout(load, 200); };
  const ch = sb.channel('ticket-stage');
  for (const table of ['ticket_prizes', 'ticket_draws', 'ticket_settings', 'ticket_players']) {
    ch.on('postgres_changes', { event: '*', schema: 'public', table }, schedule);
  }
  ch.subscribe();
  setInterval(load, 5000);
  load();
})();
</script>
</body>
</html>
