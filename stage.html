<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>뽑기 무대 화면</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap">
<style>
  /* 앱과 같은 '벨벳 라운지' 톤: 짙은 자주빛 남색 + 샴페인 골드 */
  :root {
    --bg: #0D0A17;
    --panel: #17122A;
    --panel-2: #211A36;
    --line: rgba(255, 255, 255, .07);
    --line-2: rgba(255, 255, 255, .12);
    --text: #F4F1FA;
    --muted: #A49DB8;
    --dim: #7D7690;
    --gold: #E8C27A;
    --gold-soft: rgba(232, 194, 122, .14);
    --gold-line: rgba(232, 194, 122, .3);
    --gold-ink: #1A1206;
    --green: #8FE3B5;
    --num: "Unbounded", "IBM Plex Sans KR", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text); overflow: hidden;
    font-family: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  }
  .wrap { height: 100%; display: grid; grid-template-rows: auto 1fr; padding: 3vh 2.6vw; gap: 3vh; }

  header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 2vw; }
  .title { display: flex; flex-direction: column; gap: .4vh; }
  .title small { font-family: var(--num); font-size: 1.5vh; letter-spacing: .3em; color: var(--gold); }
  .title b { font-size: 4.6vh; font-weight: 700; letter-spacing: -.01em; }
  .status { display: inline-flex; align-items: center; gap: 1vh; font-size: 2vh; font-weight: 600; padding: 1vh 2vh; border-radius: 99px; border: 1px solid var(--line-2); color: var(--muted); }
  .status i { width: 1vh; height: 1vh; border-radius: 50%; background: var(--dim); }
  .status.open { color: var(--green); border-color: rgba(143, 227, 181, .35); }
  .status.open i { background: var(--green); }
  .counter { justify-self: end; display: flex; flex-direction: column; align-items: flex-end; gap: 1vh; min-width: 26vw; }
  .counter .label { font-size: 1.8vh; color: var(--muted); }
  .counter .num { font-family: var(--num); font-size: 7.5vh; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; color: var(--gold); }
  .counter .num span { color: var(--dim); font-size: 3.6vh; }
  .counter .bar { width: 100%; height: .5vh; border-radius: .25vh; background: rgba(255, 255, 255, .08); overflow: hidden; }
  .counter .bar i { display: block; height: 100%; background: var(--gold); transition: width .6s ease; }

  main { display: grid; grid-template-columns: 1fr 28vw; gap: 2vw; min-height: 0; }
  .prizes { display: grid; grid-auto-rows: min-content; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.6vh; align-content: start; overflow: hidden; }
  .prize {
    background: var(--panel); border: 1px solid var(--line); border-radius: 2.2vh;
    padding: 1.6vh 2vh 1.6vh 1.6vh; display: grid; grid-template-columns: auto 1fr auto; gap: 1.8vh; align-items: center;
  }
  .prize.first { border-color: var(--gold-line); }
  .prize.soldout { opacity: .4; }
  .p-emoji { font-size: 6vh; width: 10.5vh; height: 10.5vh; border-radius: 1.6vh; background: #FFFFFF; display: grid; place-items: center; overflow: hidden; }
  .p-emoji .photo { width: 100%; height: 100%; object-fit: cover; }
  .p-grade { display: inline-block; font-family: var(--num); font-size: 1.5vh; font-weight: 700; background: var(--gold-soft); color: var(--gold); padding: .3vh 1vh; border-radius: .8vh; }
  .prize.first .p-grade { background: var(--gold); color: var(--gold-ink); }
  .p-name { font-size: 2.7vh; font-weight: 700; margin-top: .6vh; }
  .p-left { text-align: right; }
  .p-left b { font-family: var(--num); font-size: 4.4vh; font-weight: 600; line-height: 1; }
  .prize.first .p-left b { color: var(--gold); }
  .p-left span { display: block; font-size: 1.6vh; color: var(--muted); margin-top: .4vh; }
  .p-winners { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: .8vh; }
  .p-winners span { font-size: 1.8vh; font-weight: 600; padding: .4vh 1.2vh; border-radius: 99px; background: var(--panel-2); }

  .feed { background: var(--panel); border: 1px solid var(--line); border-radius: 2.2vh; padding: 2.2vh; display: flex; flex-direction: column; min-height: 0; }
  .feed h2 { margin: 0 0 1.6vh; font-size: 2.2vh; font-weight: 700; display: flex; align-items: center; gap: 1vh; }
  .feed h2 i { width: 1vh; height: 1vh; border-radius: 50%; background: var(--green); }
  .feed-list { display: flex; flex-direction: column; gap: .4vh; overflow: hidden; }
  .feed-item { display: flex; align-items: center; gap: 1.4vh; padding: 1.1vh 1.2vh; border-radius: 1.4vh; font-size: 2.2vh; }
  .feed-item.enter { animation: slideIn .5s ease; }
  .feed-item.big { background: var(--gold-soft); }
  .feed-item .fe { width: 4.6vh; height: 4.6vh; border-radius: 1vh; background: #FFFFFF; display: grid; place-items: center; font-size: 2.8vh; overflow: hidden; flex-shrink: 0; }
  .feed-item .fe .photo { width: 100%; height: 100%; object-fit: cover; }
  .feed-item .fn { flex: 1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .feed-item .fr { font-family: var(--num); font-size: 1.8vh; font-weight: 600; color: var(--muted); }
  .feed-item.big .fr { color: var(--gold); }
  @keyframes slideIn { from { transform: translateX(3vw); opacity: 0; } }
  .team { display: inline-block; font-size: .78em; font-weight: 700; padding: .1em .55em; border-radius: .5em; margin-right: .4em;
    background: color-mix(in srgb, var(--c) 18%, transparent); color: var(--c); }
  .empty { color: var(--muted); font-size: 2.2vh; text-align: center; padding: 4vh 0; }

  /* 당첨 발표 */
  #announce {
    position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; text-align: center;
    background: rgba(9, 7, 17, .94);
    animation: fadeIn .35s ease;
  }
  #announce.hide { animation: fadeOut .5s ease forwards; }
  @keyframes fadeIn { from { opacity: 0; } }
  @keyframes fadeOut { to { opacity: 0; } }
  .an-rays { position: absolute; width: 150vh; height: 150vh; left: 50%; top: 46%; margin: -75vh 0 0 -75vh;
    background: repeating-conic-gradient(rgba(232, 194, 122, .07) 0 8deg, transparent 8deg 16deg);
    animation: spin 24s linear infinite; border-radius: 50%;
    -webkit-mask-image: radial-gradient(circle, #000 20%, transparent 65%); mask-image: radial-gradient(circle, #000 20%, transparent 65%); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .an-body { position: relative; display: flex; flex-direction: column; align-items: center; }
  .an-congrats { font-family: var(--num); font-size: 2.4vh; font-weight: 600; letter-spacing: .4em; color: var(--gold); animation: pop .6s cubic-bezier(.2, 1.4, .4, 1); }
  .an-emoji { font-size: 20vh; line-height: 1.1; margin-top: 3vh; animation: pop .7s .1s cubic-bezier(.2, 1.4, .4, 1) both; }
  .an-emoji .photo { height: 34vh; max-width: 56vw; object-fit: contain; border-radius: 2.4vh; display: block; background: #FFFFFF; padding: 1.6vh; box-shadow: 0 0 0 .4vh var(--gold); }
  .an-grade { display: inline-block; font-family: var(--num); font-size: 4vh; font-weight: 700; background: var(--gold); color: var(--gold-ink); padding: .8vh 3vh; border-radius: 1.6vh; margin-top: 3.4vh; animation: pop .6s .25s cubic-bezier(.2, 1.4, .4, 1) both; }
  .an-prize { font-size: 4.6vh; font-weight: 700; margin-top: 1.6vh; animation: pop .6s .35s cubic-bezier(.2, 1.4, .4, 1) both; }
  .an-who { font-size: 8.5vh; font-weight: 700; margin-top: 2.4vh; color: var(--gold); letter-spacing: -.01em; animation: pop .7s .5s cubic-bezier(.2, 1.4, .4, 1) both; }
  .an-who .team { font-size: .42em; vertical-align: middle; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } }
  .coin {
    position: fixed; top: -6vh; width: 4.4vh; height: 4.4vh; border-radius: 50%; z-index: 11; pointer-events: none;
    background: radial-gradient(circle at 35% 30%, #FFF4D6, #E8C27A 50%, #B88A3E);
    box-shadow: inset 0 0 0 .25vh #A87B32;
    animation: fall linear forwards;
  }
  @keyframes fall { to { transform: translateY(115vh) rotate(var(--r)); } }

  .sound-btn {
    position: fixed; right: 2vw; bottom: 2.4vh; z-index: 20; cursor: pointer;
    background: var(--panel); color: var(--muted); padding: 1vh 1.8vh; border-radius: 1.2vh; font: inherit; font-size: 1.7vh; font-weight: 600;
    border: 1px solid var(--line-2);
  }
  .sound-btn.on { color: var(--gold); border-color: var(--gold-line); }
  body.idle .sound-btn { opacity: 0; transition: opacity .5s; }
  /* Netlify 가 끼워 넣는 'Powered by Netlify' 배지 숨김 */
  #nl-badge-frame { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title"><small>LUCKY DRAW</small><b>뽑기권 럭키 드로우</b></div>
    <div class="status" id="status"><i></i>연결 중…</div>
    <div class="counter">
      <div class="label">상자에 남은 복권</div>
      <div class="num" id="counter">---<span> / ---</span></div>
      <div class="bar"><i id="counter-bar" style="width:100%"></i></div>
    </div>
  </header>
  <main>
    <div class="prizes" id="prizes"></div>
    <aside class="feed">
      <h2><i></i>실시간 결과</h2>
      <div class="feed-list" id="feed"></div>
    </aside>
  </main>
</div>
<button class="sound-btn" id="sound-btn">소리 켜기</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(() => {
  'use strict';
  const cfg = window.TICKET_CONFIG;
  const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, { auth: { persistSession: false } });
  const TEAM_COLORS = ['#F08A7E', '#7FB4F0', '#7FD6A8', '#B9A4F2', '#F2B48A', '#F0A6C8', '#8AD3E0', '#D6D07A'];
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const team = (t) => (t ? `<span class="team" style="--c:${TEAM_COLORS[(t - 1) % 8]}">${t}팀</span>` : '');

  let prizes = [];
  let draws = [];          // 공개된(뜯은) 결과만
  let open = false;
  let seen = null;         // 이미 본 결과 id (처음 불러온 것은 발표하지 않음)
  let feedShown = null;    // 피드에 이미 그린 결과 id
  const queue = [];
  let showing = false;
  let sound = false;

  // 꽝이 아니고 '무대 발표'가 켜진 상품만 크게 발표 (흔한 상품은 목록에만)
  const isBig = (d) => !d.is_blank && prizes.find((p) => p.id === d.prize_id)?.announce !== false;

  // ---------------- 데이터 ----------------
  async function load() {
    const [pz, dr, st] = await Promise.all([
      sb.from('ticket_prizes').select('*').order('sort').order('id'),
      sb.from('ticket_draws').select('id,player_name,team,prize_id,grade,prize_name,emoji,is_blank,revealed_at')
        .eq('revealed', true).order('revealed_at', { ascending: false }).limit(2000),
      sb.from('ticket_settings').select('*'),
    ]);
    if (pz.error || dr.error || st.error) { $('status').innerHTML = '<i></i>연결 오류'; return; }
    prizes = pz.data;
    draws = dr.data;
    open = st.data.some((s) => s.key === 'draw_open' && s.value === 'true');

    if (seen === null) {
      seen = new Set(draws.map((d) => d.id));
      // stage.html?demo → 최근 당첨을 다시 발표 (리허설용)
      if (new URLSearchParams(location.search).has('demo')) {
        const last = draws.find(isBig)
          || { player_name: '홍길동', team: 1, prize_id: null, grade: 'A상', prize_name: '미리보기 상품', emoji: '🎁' };
        queue.push(last);
        setTimeout(nextAnnounce, 800);
      }
    } else {
      // 오래된 것부터 발표
      const fresh = draws.filter((d) => !seen.has(d.id)).reverse();
      for (const d of fresh) {
        seen.add(d.id);
        if (isBig(d)) queue.push(d);
      }
      if (fresh.length) beep(fresh.some(isBig) ? null : 'blip');
      nextAnnounce();
    }
    render();
  }

  // 상품 사진이 있으면 사진, 없으면 이모지
  function visual(prizeId, emoji) {
    const url = prizes.find((p) => p.id === prizeId)?.image_url;
    return url
      ? `<img class="photo" src="${esc(url)}" alt="" onerror="this.replaceWith(document.createTextNode(this.dataset.fallback))" data-fallback="${esc(emoji)}">`
      : esc(emoji);
  }

  function render() {
    const total = prizes.reduce((s, p) => s + p.quantity, 0);
    const remaining = prizes.reduce((s, p) => s + p.remaining, 0);
    $('counter').innerHTML = `${remaining}<span> / ${total}</span>`;
    $('counter-bar').style.width = `${total ? Math.round((remaining / total) * 100) : 0}%`;
    $('status').innerHTML = `<i></i>${open ? '뽑기 진행 중' : '곧 뽑기가 시작됩니다'}`;
    $('status').className = `status ${open ? 'open' : ''}`;

    const real = prizes.filter((p) => !p.is_blank);
    $('prizes').innerHTML = real.length === 0
      ? '<div class="empty">상품 준비 중…</div>'
      : real.map((p, i) => {
        const won = draws.filter((d) => d.prize_id === p.id);
        const left = p.quantity - won.length;
        return `
          <div class="prize ${i === 0 ? 'first' : ''} ${left <= 0 ? 'soldout' : ''}">
            <div class="p-emoji">${visual(p.id, p.emoji)}</div>
            <div><span class="p-grade">${esc(p.grade)}</span><div class="p-name">${esc(p.name)}</div></div>
            <div class="p-left"><b>${left}</b><span>/ ${p.quantity} 남음</span></div>
            ${!won.length ? '' : p.announce === false
              ? `<div class="p-winners"><span>당첨 ${won.length}명</span></div>`
              : `<div class="p-winners">${won.map((d) => `<span>${team(d.team)}${esc(d.player_name)}</span>`).join('')}</div>`}
          </div>`;
      }).join('');

    // 5초마다 다시 그려도 새로 들어온 결과만 애니메이션
    const firstRender = feedShown === null;
    feedShown = feedShown || new Set();
    $('feed').innerHTML = draws.length === 0
      ? '<div class="empty">아직 결과가 없어요</div>'
      : draws.slice(0, 14).map((d) => `
        <div class="feed-item ${isBig(d) ? 'big' : ''} ${!firstRender && !feedShown.has(d.id) ? 'enter' : ''}">
          <div class="fe">${d.is_blank ? '😢' : visual(d.prize_id, d.emoji)}</div>
          <div class="fn">${team(d.team)}${esc(d.player_name)}</div>
          <div class="fr">${esc(d.grade)}</div>
        </div>`).join('');
    draws.forEach((d) => feedShown.add(d.id));
  }

  // ---------------- 당첨 발표 ----------------
  function nextAnnounce() {
    if (showing || !queue.length) return;
    showing = true;
    const d = queue.shift();
    const el = document.createElement('div');
    el.id = 'announce';
    el.innerHTML = `
      <div class="an-rays"></div>
      <div class="an-body">
        <div class="an-congrats">CONGRATULATIONS</div>
        <div class="an-emoji">${visual(d.prize_id, d.emoji)}</div>
        <div class="an-grade">${esc(d.grade)} 당첨</div>
        <div class="an-prize">${esc(d.prize_name)}</div>
        <div class="an-who">${team(d.team)}${esc(d.player_name)}</div>
      </div>`;
    document.body.appendChild(el);
    beep('fanfare');
    coinRain();
    setTimeout(() => {
      el.classList.add('hide');
      setTimeout(() => { el.remove(); showing = false; nextAnnounce(); }, 500);
    }, queue.length ? 3000 : 5000);   // 뒤에 대기 중이면 3초, 아니면 5초
  }

  function coinRain() {
    for (let i = 0; i < 50; i++) {
      const c = document.createElement('div');
      c.className = 'coin';
      c.style.left = `${Math.random() * 100}vw`;
      c.style.setProperty('--r', `${Math.random() * 1080 - 540}deg`);
      c.style.animationDuration = `${1.8 + Math.random() * 1.8}s`;
      c.style.animationDelay = `${Math.random() * 1.2}s`;
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 5000);
    }
  }

  // ---------------- 소리 (브라우저 정책상 한 번 클릭해야 켜짐) ----------------
  let ac = null;
  function beep(kind) {
    if (!sound || !kind) return;
    try {
      ac = ac || new AudioContext();
      const now = ac.currentTime;
      const tone = (f, s, len, vol, type = 'triangle') => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = type; o.frequency.value = f;
        g.gain.setValueAtTime(vol, now + s);
        g.gain.exponentialRampToValueAtTime(0.0001, now + s + len);
        o.connect(g).connect(ac.destination);
        o.start(now + s); o.stop(now + s + len + 0.02);
      };
      if (kind === 'fanfare') {
        [392, 523, 659, 784].forEach((f, i) => tone(f, i * 0.12, 0.2, 0.15));
        [1047, 1319, 1568].forEach((f) => tone(f, 0.5, 1.0, 0.1));
      }
      if (kind === 'blip') tone(660, 0, 0.12, 0.06, 'sine');
    } catch {}
  }
  $('sound-btn').addEventListener('click', () => {
    sound = !sound;
    $('sound-btn').textContent = sound ? '소리 켜짐' : '소리 켜기';
    $('sound-btn').classList.toggle('on', sound);
    if (sound) { ac = ac || new AudioContext(); ac.resume(); }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'f' || e.key === 'F') {
      if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.();
    }
  });
  // 마우스를 안 움직이면 버튼 숨김
  let idleTimer;
  document.addEventListener('mousemove', () => {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => document.body.classList.add('idle'), 3000);
  });

  // ---------------- 실시간 ----------------
  let t = null;
  const schedule = () => { clearTimeout(t); t = setTimeout(load, 200); };
  const ch = sb.channel('ticket-stage');
  for (const table of ['ticket_prizes', 'ticket_draws', 'ticket_settings']) {
    ch.on('postgres_changes', { event: '*', schema: 'public', table }, schedule);
  }
  ch.subscribe();
  setInterval(load, 5000);
  load();
})();
</script>
</body>
</html>
